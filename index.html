<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HotDang!</title>
<meta name="description" content="Find the closest hotdog to you, anywhere in the world.">
<meta name="theme-color" content="#e0352b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HotDang">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Lilita+One&family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>
<div class="app">
  <header class="banner">
    <div class="dog" aria-hidden="true">
      <div class="bun-back"></div>
      <div class="sausage"></div>
      <svg class="mustard" viewBox="0 0 400 24" preserveAspectRatio="none"><path d="M0 12 Q5 0 10 12 T20 12 T30 12 T40 12 T50 12 T60 12 T70 12 T80 12 T90 12 T100 12 T110 12 T120 12 T130 12 T140 12 T150 12 T160 12 T170 12 T180 12 T190 12 T200 12 T210 12 T220 12 T230 12 T240 12 T250 12 T260 12 T270 12 T280 12 T290 12 T300 12 T310 12 T320 12 T330 12 T340 12 T350 12 T360 12 T370 12 T380 12 T390 12 T400 12" stroke="#ffc61a" stroke-width="5" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
      <div class="bun-front"></div>
      <div class="eye l"></div><div class="eye l2"></div>
    </div>
    <h1 class="brand">Hot<span class="bang">Dang!</span></h1>
  </header>
  <main>
    <div class="mapwrap">
      <div id="map" role="application" aria-label="Map of hotdog spots near you"></div>
      <button class="counter" id="counter" aria-label="Hotdogs you've eaten. Open your stats">
        <svg viewBox="0 0 34 20" aria-hidden="true"><rect x="3" y="4" width="28" height="9" rx="4.5" fill="#f3b960" stroke="#3a2210" stroke-width="1.5"/><rect x="1" y="6" width="32" height="7" rx="3.5" fill="#c84a2a" stroke="#3a2210" stroke-width="1.5"/><rect x="2" y="10" width="30" height="8" rx="4" fill="#df9440" stroke="#3a2210" stroke-width="1.5"/></svg>
        <b id="count">0</b><span>eaten</span>
      </button>
      <button class="donatepill" id="donateBtn" aria-label="Donate a Dog: buy a meal for someone through a small food charity">❤️ Donate a Dog</button>
      <form class="search" id="searchForm" role="search" hidden>
        <label class="sr" for="searchInput">Search for a place</label>
        <input type="search" id="searchInput" placeholder="City, suburb, street or place" autocomplete="off" enterkeyhint="search">
        <button class="tool" type="submit">Go</button>
        <button class="tool" type="button" id="searchClose" aria-label="Close search">✕</button>
        <div class="search-results" id="searchResults" hidden></div>
      </form>
      <div class="maptools">
        <button class="tool" id="searchBtn" aria-expanded="false" aria-controls="searchForm">🔍 Search</button>
        <button class="tool" id="locateBtn">Find me</button>
        <button class="tool" id="addBtn" aria-pressed="false">+ Add a spot</button>
        <button class="tool" id="moveBtn" aria-pressed="false">Move me</button>
      </div>
      <div class="hint" id="hint" hidden></div>
      <button class="find" id="find">Dog me!</button>
    </div>
    <aside class="panel">
      <div class="panel-inner" id="panel"></div>
    </aside>
  </main>
</div>
<div class="dogpop" id="dogpop" hidden>
  <div class="dogpop-card" role="dialog" aria-modal="true" aria-labelledby="dogpop-title">
    <button class="dogpop-x" id="dogpopClose" aria-label="Close">✕</button>
    <div id="dogpopBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js?v=15"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="social.js?v=15"></script>
<script src="app.js?v=15"></script>
</body>
</html>
